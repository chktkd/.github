---
name: 機能要望
description: 新機能や改善案を提案する
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: "markdown"
    attributes:
      value: |
        提案ありがとうございます。実装判断に必要な背景と期待値を入力してください。

  - type: "textarea"
    id: "problem"
    attributes:
      label: 解決したい問題
      description: どの課題や不便さを解消したいのか記載してください
      placeholder: "例: 大量データを毎回手作業で CSV に整形しており運用負荷が高い"
    validations:
      required: true

  - type: "textarea"
    id: "proposal"
    attributes:
      label: 提案内容
      description: ほしい機能や変更内容を具体的に記載してください
      placeholder: "例: `export --format csv` を追加し、現在の検索条件で出力できるようにする"
    validations:
      required: true

  - type: "textarea"
    id: "use_case"
    attributes:
      label: 想定ユースケース
      description: 誰が、いつ、どのように使うのか記載してください
      placeholder: |
        - 運用担当者が週次レポート作成前に使う
        - CI から定期的に呼び出して成果物を保存する
    validations:
      required: true

  - type: "textarea"
    id: "acceptance"
    attributes:
      label: 受け入れ条件
      description: 実現できたと判断できる条件を記載してください
      placeholder: |
        - CSV を UTF-8 で出力できる
        - 既存の JSON 出力を壊さない
        - 1000 件程度でも実用速度で完了する

  - type: "textarea"
    id: "alternatives"
    attributes:
      label: 代替案・回避策
      description: 検討済みの別案や現在の回避策があれば記載してください

  - type: "dropdown"
    id: "priority"
    attributes:
      label: 優先度
      options:
        - 低
        - 中
        - 高
    validations:
      required: true

  - type: "textarea"
    id: "additional"
    attributes:
      label: 補足
      description: 参考リンク、モック、関連 Issue などがあれば記載してください

  - type: "checkboxes"
    id: "checklist"
    attributes:
      label: チェックリスト
      options:
        - label: 既存の Issue を検索しました
          required: true
        - label: 背景と期待する結果を記載しました
          required: true
