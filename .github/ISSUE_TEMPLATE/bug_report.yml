---
name: バグ報告
description: 不具合や期待と異なる動作を報告する
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: "markdown"
    attributes:
      value: |
        不具合報告ありがとうございます。再現と切り分けに必要な情報を入力してください。

  - type: "textarea"
    id: "summary"
    attributes:
      label: 概要
      description: 何が起きているかを一文で説明してください
      placeholder: "例: `foo --dry-run` 実行時に設定ファイルが見つからず終了する"
    validations:
      required: true

  - type: "textarea"
    id: "steps"
    attributes:
      label: 再現手順
      description: 再現に必要な手順を順番に記載してください
      placeholder: |
        1. `...` を実行
        2. `...` を入力
        3. `...` を確認
    validations:
      required: true

  - type: "textarea"
    id: "expected"
    attributes:
      label: 期待される結果
      description: 本来どうなるべきかを記載してください
    validations:
      required: true

  - type: "textarea"
    id: "actual"
    attributes:
      label: 実際の結果
      description: 実際に起きたことを記載してください
    validations:
      required: true

  - type: "textarea"
    id: "scope"
    attributes:
      label: 影響範囲
      description: どの機能、画面、コマンド、環境に影響するか記載してください
      placeholder: "例: 管理画面のログイン後画面のみ / CLI の import subcommand のみ"

  - type: "textarea"
    id: "environment"
    attributes:
      label: 実行環境
      description: 分かる範囲で実行環境を記載してください
      value: |
        - OS:
        - Runtime / Language:
        - Browser / Client:
        - App / Package version:
        - Other:
    validations:
      required: true

  - type: "textarea"
    id: "logs"
    attributes:
      label: ログ・エラーメッセージ
      description: 関連するログ、スタックトレース、エラーメッセージを貼ってください
      render: "shell"

  - type: "textarea"
    id: "additional"
    attributes:
      label: 補足
      description: スクリーンショット、関連設定、回避策などがあれば記載してください

  - type: "checkboxes"
    id: "checklist"
    attributes:
      label: チェックリスト
      options:
        - label: 既存の Issue を検索しました
          required: true
        - label: 再現手順と実行環境を記載しました
          required: true
        - label: 機密情報を含んでいないことを確認しました
          required: true
